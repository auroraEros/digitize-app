<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitize App shopping</title>
    <link rel="stylesheet" href="./build/tailwind.css" />
  </head>
  <body class="bg-gray-100 pt-8 px-4">
    <!-- app bar -->
    <header class="mb-4">
      <nav class="md:hidden flex justify-between items-center p-1">
        <img
          class="max-w-full w-12 h-10 block"
          src="/assets/images/Digitize Logo.png"
          alt=""
        />

        <h1 class="font-bold text-xl text-slate-800">ساعت هوشمند</h1>
        <div
          class="flex justify-center items-center w-7 h-7 rounded-md bg-white shadow-lg"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
        </div>
      </nav>
    </header>

    <main>
      <!-- filter & sort phone -->
      <section
        class="md:hidden flex justify-between items-center gap-x-2.5 mb-4"
      >
        <!-- popular product -->
        <div
          class="flex items-center gap-x-2 w-full h-12 rounded-md px-1.5 bg-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 stroke-orange-500"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0-3.75-3.75M17.25 21 21 17.25"
            />
          </svg>

          <span class="text-sm text-slate-800 pb-1">محبوب‌ترین‌ها </span>
        </div>
        <!-- product filter -->
        <div
          class="flex items-center gap-x-2 w-full h-12 rounded-md px-1.5 bg-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 stroke-orange-500"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"
            />
          </svg>

          <span class="text-sm text-slate-800 pb-1">فیلتر: اپل</span>
        </div>
      </section>
      <!-- product section -->
      <section
        x-data="{products:[{id:1, title:'ساعت هوشمند اپال سری 6',price:'2،250،000 تومان'},
        {id:2, title:'ساعت هوشمند اپال سری 7',price:'2،250،000 تومان'},
        {id:3, title:'ساعت هوشمند اپال سری 8',price:'2،250،000 تومان'},
        {id:4, title:'ساعت هوشمند اپال سری 9',price:'2،250،000 تومان'}]}"
        class="grid grid-cols-2 gap-x-2.5 gap-y-8 pt-6 pb-2 md:grid-cols-3  sm:gap-x-4 md:gap-x-8 md:gap-y-10 lg:grid-cols-4"
      >
        <template x-for="product in products" :key="product.id">
          <div class="max-w-md pt-3 px-1.5 rounded-xl bg-white">
            <div
              class="flex justify-center items-center bg-slate-200 rounded-xl mb-2 p-4 relative"
            >
              <button
                class="flex justify-center items-center w-6 h-6 rounded-full bg-gray-400 absolute top-1.5 right-2"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-4 h-4 stroke-orange-400 fill-orange-400"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
                  />
                </svg>
              </button>
              <div class="w-full flex justify-center items-center">
                <img
                  class="block max-w-full w-16 "
                  src="/assets/images/apple-watch-7.png"
                  alt="apple-watch-7"
                />
              </div>
            </div>
            <div class="flex justify-between w-full p-1 mb-2">
              <p class="text-xs text-slate-200 sm:text-sm">اپل</p>
              <div x-data="{color:'red'}" class="flex">
                <button
                  @click="color='blue'"
                  :class="color==='blue'?' flex justify-center items-center ring-2 ring-indigo-600':''"
                  class="block bg-indigo-600 w-4 h-4 md:w-8 md:h-8 rounded-full border-2 border-white"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-2 h-2 md:w-4 md:h-4 stroke-white"
                    x-show="color==='blue'"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m4.5 12.75 6 6 9-13.5"
                    />
                  </svg>
                </button>
                <button
                  @click="color='yellow'"
                  :class="color==='yellow'?' flex justify-center items-center ring-2 ring-yellow-400':''"
                  class="block bg-yellow-400 w-4 h-4 md:w-8 md:h-8 rounded-full border-2 border-white -mr-1"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-2 h-2 md:w-4 md:h-4 stroke-white"
                    x-show="color==='yellow'"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m4.5 12.75 6 6 9-13.5"
                    />
                  </svg>
                </button>
                <button
                  @click="color='orange'"
                  :class="color==='orange'?' flex justify-center items-center ring-2 ring-orange-400':''"
                  class="block bg-orange-400 w-4 h-4 md:w-8 md:h-8 rounded-full border-2 border-white -mr-1"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-2 h-2 md:w-4 md:h-4 stroke-white"
                    x-show="color==='orange'"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m4.5 12.75 6 6 9-13.5"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="mb-2">
              <h2
                x-text="product.title"
                class="mb-2 text-slate-900 text-xs text-bold sm:text-sm md:text-base"
              ></h2>
              <p
                x-text="product.price"
                class="text-orange-500 text-xs font-bold text-left"
              ></p>
            </div>

            <button
              class="block w-full py-2 text-center fomt-bold text-sm sm:text-sm md:text-base border-t border-slate-200 text-orange-500"
            >
              مشاهده و سفارش
            </button>
          </div>
        </template>
      </section>
    </main>

    <script src="//unpkg.com/alpinejs" defer></script>
  </body>
</html>
